<script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.service.worker.js').catch(err => console.log(err));
    }

    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyFB01sHvXjUVU1-fHfOuKsEVxAY_LeO7Uf3VyoP6-92nL1LwQHeyan_WhAYzEDO3lD3g/exec";

    let dbMaster = { rekening: [], kategoriMasuk: [], kategoriKeluar: [] };
    let dbTransaksi = [];
    let chartSaldoInstance = null;
    let chartMasukKeluarInstance = null;
    let currentFilter = { mode: 'all', start: '', end: '' };
    let activeDetailRekeningName = '';
    let activeTransactionDate = new Date();

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('currentDate').innerText = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
      document.getElementById('printDate').innerText = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
      document.getElementById('txTanggal').value = new Date().toISOString().split('T')[0];
      
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark');
        document.getElementById('darkIcon').className = "fa-solid fa-sun";
      }
      
      fetchBackendData();
    });

    function toggleDarkMode() {
      const html = document.documentElement;
      const icon = document.getElementById('darkIcon');
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        localStorage.setItem('theme', 'light');
        icon.className = "fa-solid fa-moon";
      } else {
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
        icon.className = "fa-solid fa-sun";
      }
    }

    async function fetchBackendData() {
      try {
        const res = await fetch(`${GAS_API_URL}?action=getData`);
        const data = await res.json();
        dbMaster = data.dbMaster || { rekening: [], kategoriMasuk: [], kategoriKeluar: [] };
        dbTransaksi = data.dbTransaksi || [];
        refreshAppUI();
      } catch (err) {
        console.error("Gagal mengambil data dari Google Sheets:", err);
      }
    }

    async function postToBackend(action, payload) {
      try {
        await fetch(GAS_API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action, payload })
        });
        setTimeout(fetchBackendData, 1200);
      } catch (err) {
        console.error("Gagal mengirim data ke server:", err);
      }
    }

    function refreshAppUI() {
      dbTransaksi.sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));
      renderMasterOptions();
      renderMasterList();
      renderTransaksi();
      if(!document.getElementById('page-laporan').classList.contains('hidden')) {
        renderLaporanView();
      }
    }

    function switchTab(tab) {
      ['transaksi', 'laporan', 'pengaturan'].forEach(t => {
        document.getElementById(`page-${t}`).classList.add('hidden');
        const nav = document.getElementById(`nav-${t}`);
        nav.classList.remove('text-emerald-600', 'dark:text-emerald-400');
        nav.classList.add('text-gray-400', 'dark:text-gray-400');
      });

      document.getElementById(`page-${tab}`).classList.remove('hidden');
      const activeNav = document.getElementById(`nav-${tab}`);
      activeNav.classList.remove('text-gray-400', 'dark:text-gray-400');
      activeNav.classList.add('text-emerald-600', 'dark:text-emerald-400');

      const fab = document.getElementById('fabContainer');
      const fabMaster = document.getElementById('fabMasterContainer');
      
      fab.classList.add('hidden');
      fabMaster.classList.add('hidden');
      document.getElementById('actionMenu').classList.add('hidden');

      if (tab === 'transaksi') {
        fab.classList.remove('hidden');
      } else if (tab === 'pengaturan') {
        fabMaster.classList.remove('hidden');
      }

      if (tab === 'laporan') {
        renderLaporanView();
      }
    }

    function toggleActionMenu() {
      const menu = document.getElementById('actionMenu');
      const icon = document.getElementById('fabIcon');
      menu.classList.toggle('hidden');
      icon.classList.toggle('rotate-45');
    }

    function changeMonth(direction) {
      activeTransactionDate.setMonth(activeTransactionDate.getMonth() + direction);
      renderTransaksi();
    }

    // Kalkulasi Saldo Sambung Otomatis Antar Bulan
    function renderTransaksi() {
      const container = document.getElementById('listTransaksi');
      
      const options = { month: 'long', year: 'numeric' };
      document.getElementById('labelBulanAktif').innerText = activeTransactionDate.toLocaleDateString('id-ID', options);
      document.getElementById('labelPeriodeRingkasan').innerText = activeTransactionDate.toLocaleDateString('id-ID', { month: 'short', year: 'numeric' });

      const targetYear = activeTransactionDate.getFullYear();
      const targetMonth = activeTransactionDate.getMonth();

      let sumMasukBulan = 0, sumKeluarBulan = 0;
      const groupedByDate = {};

      dbTransaksi.forEach((tx) => {
        const tDate = new Date(tx.tanggal);
        const amt = Number(tx.jumlah);

        if (tDate.getFullYear() === targetYear && tDate.getMonth() === targetMonth) {
          if (tx.tipe === 'Pemasukan') sumMasukBulan += amt;
          else if (tx.tipe === 'Pengeluaran') sumKeluarBulan += amt;

          const dateStr = tx.tanggal;
          if (!groupedByDate[dateStr]) groupedByDate[dateStr] = [];
          groupedByDate[dateStr].push(tx);
        }
      });

      // Hitung Saldo Kumulatif Sambung Otomatis sampai akhir bulan aktif ini
      let kumulatifMasuk = 0;
      let kumulatifKeluar = 0;
      dbTransaksi.forEach((tx) => {
        const tDate = new Date(tx.tanggal);
        const amt = Number(tx.jumlah);
        // Masukkan transaksi dari awal waktu hingga akhir bulan aktif
        if (tDate.getFullYear() < targetYear || (tDate.getFullYear() === targetYear && tDate.getMonth() <= targetMonth)) {
          if (tx.tipe === 'Pemasukan') kumulatifMasuk += amt;
          else if (tx.tipe === 'Pengeluaran') kumulatifKeluar += amt;
        }
      });
      const saldoAkhirKumulatif = kumulatifMasuk - kumulatifKeluar;

      document.getElementById('sumMasukBulan').innerText = 'Rp ' + sumMasukBulan.toLocaleString('id-ID');
      document.getElementById('sumKeluarBulan').innerText = 'Rp ' + sumKeluarBulan.toLocaleString('id-ID');
      document.getElementById('sumSaldoBulan').innerText = 'Rp ' + saldoAkhirKumulatif.toLocaleString('id-ID');

      const sortedDates = Object.keys(groupedByDate).sort((a, b) => new Date(b) - new Date(a));

      if (sortedDates.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-gray-400 text-sm">Tidak ada transaksi pada bulan ini. Saldo tersambung otomatis dari bulan sebelumnya.</div>`;
        return;
      }

      let html = '';
      sortedDates.forEach(dateStr => {
        const formattedDateReadable = new Date(dateStr).toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' });
        
        html += `
          <div class="space-y-2">
            <p class="text-xs font-bold text-gray-400 dark:text-gray-500 uppercase px-1">${formattedDateReadable}</p>
        `;

        groupedByDate[dateStr].forEach((tx) => {
          const amt = Number(tx.jumlah);
          let badge = 'bg-gray-100 text-gray-600', icon = 'fa-right-left';
          if (tx.tipe === 'Pemasukan') {
            badge = 'bg-emerald-50 text-emerald-600 dark:bg-emerald-900/30 dark:text-emerald-400'; icon = 'fa-circle-arrow-down';
          } else if (tx.tipe === 'Pengeluaran') {
            badge = 'bg-red-50 text-red-600 dark:bg-red-900/30 dark:text-red-400'; icon = 'fa-circle-arrow-up';
          } else {
            badge = 'bg-blue-50 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400';
          }

          const sub = tx.tipe === 'Transfer' ? `${tx.rekAsal} ➔ ${tx.rekTujuan}` : `${tx.rekAsal} • ${tx.kategori || '-'}`;
          const color = tx.tipe === 'Pemasukan' ? 'text-emerald-600' : (tx.tipe === 'Pengeluaran' ? 'text-red-600' : 'text-blue-600');

          html += `
            <div onclick='openForm(null, ${JSON.stringify(tx)})' class="bg-white dark:bg-gray-800 p-3.5 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 flex justify-between items-center cursor-pointer hover:border-emerald-500 transition">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl ${badge} flex items-center justify-center text-lg">
                  <i class="fa-solid ${icon}"></i>
                </div>
                <div>
                  <p class="font-bold text-sm text-gray-800 dark:text-gray-100">${tx.catatan || tx.kategori || tx.tipe}</p>
                  <p class="text-xs text-gray-400">${sub}</p>
                </div>
              </div>
              <div class="text-right flex items-center gap-2">
                <div>
                  <p class="font-bold text-sm ${color}">Rp ${amt.toLocaleString('id-ID')}</p>
                </div>
                <button onclick="event.stopPropagation(); hapusTx(${tx.rowIndex})" class="text-gray-400 hover:text-red-600 text-xs p-1"><i class="fa-solid fa-trash"></i></button>
              </div>
            </div>
          `;
        });
        html += `</div>`;
      });

      container.innerHTML = html;
    }

    function hapusTx(rowIndex) {
      if(confirm("Hapus transaksi ini?")) {
        postToBackend('hapusTransaksi', { rowIndex });
      }
    }

    function openFilterModal() { document.getElementById('modalFilter').classList.remove('hidden'); }
    function closeFilterModal() { document.getElementById('modalFilter').classList.add('hidden'); }

    function handlePeriodModeChange(mode) {
      document.getElementById('weeklyContainer').classList.add('hidden');
      document.getElementById('calendarContainer').classList.add('hidden');
      if (mode === 'weekly') document.getElementById('weeklyContainer').classList.remove('hidden');
      if (mode === 'calendar') document.getElementById('calendarContainer').classList.remove('hidden');
    }

    function applyFilter() {
      const mode = document.getElementById('reportPeriodMode').value;
      currentFilter.mode = mode;
      const now = new Date();

      if (mode === 'all') {
        currentFilter.start = ''; currentFilter.end = '';
      } else if (mode === 'monthly') {
        const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
        currentFilter.start = firstDay.toISOString().split('T')[0];
        currentFilter.end = now.toISOString().split('T')[0];
      } else if (mode === 'weekly') {
        const val = document.getElementById('inputWeek').value;
        if (!val) return alert("Pilih minggu terlebih dahulu");
        const year = val.split('-W')[0];
        const week = val.split('-W')[1];
        const simpleDate = new Date(year, 0, 1 + (week - 1) * 7);
        const dayOfWeek = simpleDate.getDay();
        const startOfWeek = new Date(simpleDate.setDate(simpleDate.getDate() - dayOfWeek + (dayOfWeek === 0 ? -6 : 1)));
        const endOfWeek = new Date(startOfWeek);
        endOfWeek.setDate(endOfWeek.getDate() + 6);
        currentFilter.start = startOfWeek.toISOString().split('T')[0];
        currentFilter.end = endOfWeek.toISOString().split('T')[0];
      } else if (mode === 'calendar') {
        currentFilter.start = document.getElementById('filterStartDate').value;
        currentFilter.end = document.getElementById('filterEndDate').value;
      }

      closeFilterModal();
      renderLaporanView();
    }

    function filterDataByPeriod() {
      return dbTransaksi.filter(t => {
        const tDate = t.tanggal;
        if (currentFilter.mode === 'all') return true;
        if (currentFilter.start && currentFilter.end) {
          return (tDate >= currentFilter.start && tDate <= currentFilter.end);
        }
        return true;
      });
    }

    function renderLaporanView() {
      const filtered = filterDataByPeriod();
      const summaryList = document.getElementById('summaryRekeningList');
      
      const saldoMap = {};
      dbMaster.rekening.forEach(r => saldoMap[r] = 0);

      filtered.forEach(tx => {
        const amt = Number(tx.jumlah);
        if(tx.tipe === 'Pemasukan') {
          if(saldoMap[tx.rekAsal] !== undefined) saldoMap[tx.rekAsal] += amt;
        } else if(tx.tipe === 'Pengeluaran') {
          if(saldoMap[tx.rekAsal] !== undefined) saldoMap[tx.rekAsal] -= amt;
        } else if(tx.tipe === 'Transfer') {
          if(saldoMap[tx.rekAsal] !== undefined) saldoMap[tx.rekAsal] -= amt;
          if(saldoMap[tx.rekTujuan] !== undefined) saldoMap[tx.rekTujuan] += amt;
        }
      });

      let html = '';
      dbMaster.rekening.forEach(rek => {
        const saldo = saldoMap[rek] || 0;
        html += `
          <div onclick="openDetailRekening('${rek}')" class="flex justify-between items-center bg-gray-50 dark:bg-gray-900 p-3 rounded-xl border border-gray-100 dark:border-gray-700 cursor-pointer hover:bg-emerald-50 dark:hover:bg-gray-800 transition">
            <span class="font-bold text-sm text-gray-800 dark:text-gray-200"><i class="fa-solid fa-building-columns text-emerald-600 mr-2"></i> ${rek}</span>
            <div class="text-right">
              <p class="font-bold text-sm ${saldo >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-red-600'}">Rp ${saldo.toLocaleString('id-ID')}</p>
              <span class="text-[10px] text-gray-400">Ketuk untuk detail & unduh <i class="fa-solid fa-chevron-right text-[8px]"></i></span>
            </div>
          </div>
        `;
      });

      summaryList.innerHTML = html || '<p class="text-xs text-gray-400 italic">Belum ada rekening.</p>';
      renderLaporanCharts(filtered);
    }

    function openDetailRekening(rekName) {
      activeDetailRekeningName = rekName;
      const filtered = filterDataByPeriod();
      let totalMasuk = 0, totalKeluar = 0;
      let tableRowsHtml = '';

      filtered.forEach(tr => {
        let isRelevant = false;
        let isMasuk = false;
        let desc = tr.catatan || tr.kategori || tr.tipe;

        if (tr.tipe === 'Pemasukan' && tr.rekAsal === rekName) {
          isRelevant = true; isMasuk = true;
        } else if (tr.tipe === 'Pengeluaran' && tr.rekAsal === rekName) {
          isRelevant = true; isMasuk = false;
        } else if (tr.tipe === 'Transfer') {
          if (tr.rekAsal === rekName) {
            isRelevant = true; isMasuk = false; desc = `Transfer ke ${tr.rekTujuan} (${tr.catatan || ''})`;
          } else if (tr.rekTujuan === rekName) {
            isRelevant = true; isMasuk = true; desc = `Transfer dari ${tr.rekAsal} (${tr.catatan || ''})`;
          }
        }

        if (isRelevant) {
          if (isMasuk) totalMasuk += tr.jumlah; else totalKeluar += tr.jumlah;
          tableRowsHtml += `
            <tr class="border-b dark:border-gray-700">
              <td class="p-2">${tr.tanggal}</td>
              <td class="p-2 font-medium">${tr.tipe}</td>
              <td class="p-2 text-gray-600 dark:text-gray-300">${desc}</td>
              <td class="p-2 text-right font-bold ${isMasuk ? 'text-emerald-600' : 'text-red-600'}">
                ${isMasuk ? '+' : '-'} Rp ${tr.jumlah.toLocaleString('id-ID')}
              </td>
            </tr>
          `;
        }
      });

      const saldoAkhir = totalMasuk - totalKeluar;
      document.getElementById('pdfHeaderTitle').innerText = `Laporan Mutasi Rekening: ${rekName}`;
      document.getElementById('detailRekeningTitle').innerText = `Mutasi: ${rekName}`;
      document.getElementById('detailRekeningSaldo').innerText = `Saldo Akhir: Rp ${saldoAkhir.toLocaleString('id-ID')}`;
      document.getElementById('detailMutasiTableBody').innerHTML = tableRowsHtml || `<tr><td colspan="4" class="text-center text-gray-400 italic py-4">Tidak ada transaksi pada rekening ini.</td></tr>`;
      document.getElementById('modalDetailRekening').classList.remove('hidden');
    }

    function closeDetailRekening() { document.getElementById('modalDetailRekening').classList.add('hidden'); }

    function downloadRekeningExcel() {
      const filtered = filterDataByPeriod();
      let csv = `\uFEFFLAPORAN MUTASI REKENING: ${activeDetailRekeningName}\n`;
      csv += `Tanggal Pencetakan: "${new Date().toLocaleDateString('id-ID')}"\n\n`;
      csv += `"Tanggal","Tipe Transaksi","Keterangan / Kategori","Jumlah (Rp)"\n`;

      filtered.forEach(tr => {
        let isRelevant = false;
        let desc = tr.catatan || tr.kategori || tr.tipe;
        let nominalFormatted = tr.jumlah;

        if (tr.tipe === 'Pemasukan' && tr.rekAsal === activeDetailRekeningName) {
          isRelevant = true;
        } else if (tr.tipe === 'Pengeluaran' && tr.rekAsal === activeDetailRekeningName) {
          isRelevant = true; nominalFormatted = -tr.jumlah;
        } else if (tr.tipe === 'Transfer') {
          if (tr.rekAsal === activeDetailRekeningName) {
            isRelevant = true; desc = `Transfer ke ${tr.rekTujuan} (${tr.catatan || ''})`; nominalFormatted = -tr.jumlah;
          } else if (tr.rekTujuan === activeDetailRekeningName) {
            isRelevant = true; desc = `Transfer dari ${tr.rekAsal} (${tr.catatan || ''})`;
          }
        }

        if (isRelevant) {
          csv += `"${tr.tanggal}","${tr.tipe}","${desc.replace(/"/g, '""')}",${nominalFormatted}\n`;
        }
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `Laporan_Rekening_${activeDetailRekeningName.replace(/\s+/g, '_')}_${new Date().toISOString().split('T')[0]}.csv`;
      link.click();
    }

    function downloadRekeningPDF() { window.print(); }

    function renderLaporanCharts(filteredData) {
      const saldoMap = {};
      dbMaster.rekening.forEach(r => saldoMap[r] = 0);
      let tMasuk = 0, tKeluar = 0;

      filteredData.forEach(tx => {
        const amt = Number(tx.jumlah);
        if(tx.tipe === 'Pemasukan') {
          tMasuk += amt;
          if(saldoMap[tx.rekAsal] !== undefined) saldoMap[tx.rekAsal] += amt;
        } else if(tx.tipe === 'Pengeluaran') {
          tKeluar += amt;
          if(saldoMap[tx.rekAsal] !== undefined) saldoMap[tx.rekAsal] -= amt;
        } else if(tx.tipe === 'Transfer') {
          if(saldoMap[tx.rekAsal] !== undefined) saldoMap[tx.rekAsal] -= amt;
          if(saldoMap[tx.rekTujuan] !== undefined) saldoMap[tx.rekTujuan] += amt;
        }
      });

      const ctx1 = document.getElementById('chartSaldoRekening').getContext('2d');
      if(chartSaldoInstance) chartSaldoInstance.destroy();
      chartSaldoInstance = new Chart(ctx1, {
        type: 'pie',
        data: {
          labels: Object.keys(saldoMap),
          datasets: [{ data: Object.values(saldoMap).map(v => v < 0 ? 0 : v), backgroundColor: ['#10b981', '#3b82f6', '#f59e0b', '#8b5cf6', '#ec4899'], borderWidth: 2 }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
      });

      const ctx2 = document.getElementById('chartMasukKeluar').getContext('2d');
      if(chartMasukKeluarInstance) chartMasukKeluarInstance.destroy();
      chartMasukKeluarInstance = new Chart(ctx2, {
        type: 'doughnut',
        data: {
          labels: ['Pemasukan', 'Pengeluaran'],
          datasets: [{ data: [tMasuk, tKeluar], backgroundColor: ['#10b981', '#ef4444'], borderWidth: 2 }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
      });
    }

    function openMasterForm(jenis = 'rekening', namaLama = '') {
      document.getElementById('masterForm').reset();
      const titleEl = document.getElementById('masterFormTitle');
      const jenisEl = document.getElementById('masterJenis');
      const namaEl = document.getElementById('masterNama');
      const oldNamaEl = document.getElementById('masterOldNama');

      if (namaLama) {
        titleEl.innerText = "Edit Master Data";
        jenisEl.value = jenis;
        jenisEl.disabled = true;
        namaEl.value = namaLama;
        oldNamaEl.value = namaLama;
      } else {
        titleEl.innerText = "Tambah Master Data";
        jenisEl.disabled = false;
        oldNamaEl.value = "";
      }
      document.getElementById('modalMasterForm').classList.remove('hidden');
    }

    function closeMasterForm() { document.getElementById('modalMasterForm').classList.add('hidden'); }

    function handleMasterFormSubmit(e) {
      e.preventDefault();
      const jenis = document.getElementById('masterJenis').value;
      const nama = document.getElementById('masterNama').value.trim();
      const oldNama = document.getElementById('masterOldNama').value;

      if(!nama) return alert('Nama tidak boleh kosong');

      if (oldNama) {
        postToBackend('editMaster', { jenis, oldNama, newNama: nama });
      } else {
        postToBackend('simpanMaster', { jenis, nama });
      }
      closeMasterForm();
    }

    function renderMasterOptions() {
      document.getElementById('listRekening').innerHTML = dbMaster.rekening.map(r => `<option value="${r}">`).join('');
    }

    function renderMasterList() {
      const list = document.getElementById('masterList');
      let html = '<div class="space-y-4">';
      const renderSec = (title, items, jenis) => {
        let sec = `<div class="space-y-1.5"><p class="text-xs font-bold text-gray-500 uppercase tracking-wider">${title}:</p>`;
        if(items.length === 0) sec += `<p class="text-xs text-gray-400 italic">Belum ada data</p>`;
        items.forEach((i) => {
          sec += `<div class="flex justify-between items-center bg-gray-50 dark:bg-gray-900 p-2.5 rounded-xl text-xs border border-gray-100 dark:border-gray-700">
            <span class="font-medium text-gray-700 dark:text-gray-200">${i}</span>
            <div class="flex gap-2">
              <button onclick="openMasterForm('${jenis}', '${i}')" class="text-blue-500 px-1"><i class="fa-solid fa-pen"></i></button>
              <button onclick="hapusMaster('${jenis}', '${i}')" class="text-red-500 px-1"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>`;
        });
        return sec + `</div>`;
      };
      html += renderSec('Rekening / Akun', dbMaster.rekening, 'rekening');
      html += renderSec('Kategori Pemasukan', dbMaster.kategoriMasuk, 'kategoriMasuk');
      html += renderSec('Kategori Pengeluaran', dbMaster.kategoriKeluar, 'kategoriKeluar');
      html += '</div>';
      list.innerHTML = html;
    }

    function hapusMaster(jenis, nama) {
      if(confirm(`Hapus ${nama}?`)) {
        postToBackend('hapusMaster', { jenis, nama });
      }
    }

    function openForm(tipe, editData = null) {
      if (!editData) toggleActionMenu();
      document.getElementById('txForm').reset();
      
      const titleEl = document.getElementById('formTitle');
      const fieldRekTujuan = document.getElementById('fieldRekTujuan');
      const fieldKategori = document.getElementById('fieldKategori');
      const katDatalist = document.getElementById('listKategori');

      if (editData) {
        titleEl.innerText = 'Edit Transaksi';
        document.getElementById('txRowIndex').value = editData.rowIndex;
        document.getElementById('txTanggal').value = editData.tanggal;
        document.getElementById('txTipe').value = editData.tipe;
        document.getElementById('txRekAsal').value = editData.rekAsal;
        document.getElementById('txJumlah').value = editData.jumlah;
        document.getElementById('txCatatan').value = editData.catatan;

        if (editData.tipe === 'Transfer') {
          fieldRekTujuan.classList.remove('hidden');
          fieldKategori.classList.add('hidden');
          document.getElementById('txRekTujuan').value = editData.rekTujuan;
        } else {
          fieldRekTujuan.classList.add('hidden');
          fieldKategori.classList.remove('hidden');
          document.getElementById('txKategori').value = editData.kategori;
          const katList = editData.tipe === 'Pemasukan' ? dbMaster.kategoriMasuk : dbMaster.kategoriKeluar;
          katDatalist.innerHTML = katList.map(k => `<option value="${k}">`).join('');
        }
      } else {
        document.getElementById('txRowIndex').value = '';
        document.getElementById('txTanggal').value = new Date().toISOString().split('T')[0];
        document.getElementById('txTipe').value = tipe;
        titleEl.innerText = 'Tambah ' + tipe;

        if (tipe === 'Transfer') {
          fieldRekTujuan.classList.remove('hidden');
          fieldKategori.classList.add('hidden');
        } else {
          fieldRekTujuan.classList.add('hidden');
          fieldKategori.classList.remove('hidden');
          const katList = tipe === 'Pemasukan' ? dbMaster.kategoriMasuk : dbMaster.kategoriKeluar;
          katDatalist.innerHTML = katList.map(k => `<option value="${k}">`).join('');
        }
      }

      document.getElementById('modalForm').classList.remove('hidden');
    }

    function closeForm() { document.getElementById('modalForm').classList.add('hidden'); }

    function handleFormSubmit(e) {
      e.preventDefault();
      const rowIndex = document.getElementById('txRowIndex').value;
      const payload = {
        rowIndex: rowIndex ? Number(rowIndex) : null,
        tanggal: document.getElementById('txTanggal').value,
        tipe: document.getElementById('txTipe').value,
        rekAsal: document.getElementById('txRekAsal').value,
        rekTujuan: document.getElementById('txRekTujuan').value,
        kategori: document.getElementById('txKategori').value,
        jumlah: Number(document.getElementById('txJumlah').value),
        catatan: document.getElementById('txCatatan').value
      };

      const action = rowIndex ? 'editTransaksi' : 'simpanTransaksi';
      postToBackend(action, payload);
      closeForm();
    }
  </script>
