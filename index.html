<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Money Manager KMW</title>
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Chart.js untuk Grafik Statistik -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --app-bg: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      --card-bg: #ffffff;
      --text-color: #0f172a;
    }
    body { background: var(--app-bg); color: var(--text-color); font-size: 14px; padding-bottom: 90px; min-height: 100vh; background-attachment: fixed; }
    .card { background-color: var(--card-bg); border-radius: 20px; border: 1px solid #f1f5f9; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02); }
    
    /* Pengaturan Cetak PDF agar pas di kertas */
    @media print {
      @page { size: A4 portrait; margin: 15mm; }
      header, nav, .bottom-nav, button, .fab-container { display: none !important; }
      body, .container { background: white !important; width: 100% !important; max-width: 100% !important; margin: 0 !important; padding: 0 !important; }
      .card { border: none !important; box-shadow: none !important; padding: 0 !important; }
    }
  </style>
</head>
<body id="appBody">

  <!-- Header Modern -->
  <header class="bg-white/80 backdrop-blur-md border-b border-slate-100 px-5 py-4 sticky top-0 z-20 flex justify-between items-center shadow-sm">
    <div class="flex items-center gap-2.5">
      <span class="font-extrabold text-base tracking-tight text-emerald-600"><i class="fa-solid fa-wallet mr-1.5"></i> Money Manager KMW</span>
    </div>
    <div class="text-xs font-bold text-slate-500 bg-slate-100 px-3 py-1.5 rounded-xl" id="headerTotalSaldo">Rp 0</div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">
    <input type="hidden" id="editRowIndex" value="">

    <!-- 1. HALAMAN PEMASUKAN -->
    <div id="page-masuk" class="space-y-4 hidden">
      <div class="card p-5 space-y-4">
        <h2 class="font-bold text-sm text-emerald-600" id="title-masuk">Pemasukan Baru</h2>
        <form onsubmit="handleFormSubmit(event, 'Pemasukan')" class="space-y-3.5">
          <div><label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Tanggal</label><input type="date" id="masukTanggal" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs"></div>
          <div><label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Rekening / Akun</label><input list="listRekening" id="masukRek" placeholder="Pilih atau ketik akun baru..." required autocomplete="off" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs"></div>
          <div><label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Kategori Pemasukan</label><input list="listKategoriMasuk" id="masukKat" placeholder="Pilih atau ketik kategori baru..." required autocomplete="off" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs"></div>
          <div><label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Jumlah (Rp)</label><input type="number" id="masukJumlah" placeholder="0" min="0" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-bold"></div>
          <div><label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Catatan</label><textarea id="masukCatatan" rows="2" placeholder="Catatan opsional..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs"></textarea></div>
          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold p-3 rounded-xl text-xs shadow-md transition">Simpan Pemasukan</button>
          <button type="button" class="w-full bg-slate-300 text-slate-700 font-bold p-2.5 rounded-xl text-xs cancel-edit-btn hidden" onclick="cancelEdit()">Batal Edit</button>
        </form>
      </div>
    </div>

    <!-- 2. HALAMAN PENGELUARAN -->
    <div id="page-keluar" class="space-y-4 hidden">
      <div class="card p-5 space-y-4">
        <h2 class="font-bold text-sm text-red-600" id="title-keluar">Pengeluaran Baru</h2>
        <form onsubmit="handleFormSubmit(event, 'Pengeluaran')" class="space-y-3.5">
          <div><label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Tanggal</label><input type="date" id="keluarTanggal" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs"></div>
          <div><label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Rekening / Akun</label><input list="listRekening" id="keluarRek" placeholder="Pilih atau ketik akun baru..." required autocomplete="off" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs"></div>
          <div><label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Kategori Pengeluaran</label><input list="listKategoriKeluar" id="keluarKat" placeholder="Pilih atau ketik kategori baru..." required autocomplete="off" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs"></div>
          <div><label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Jumlah (Rp)</label><input type="number" id="keluarJumlah" placeholder="0" min="0" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-bold"></div>
          <div><label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Catatan</label><textarea id="keluarCatatan" rows="2" placeholder="Catatan opsional..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs"></textarea></div>
          <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold p-3 rounded-xl text-xs shadow-md transition">Simpan Pengeluaran</button>
          <button type="button" class="w-full bg-slate-300 text-slate-700 font-bold p-2.5 rounded-xl text-xs cancel-edit-btn hidden" onclick="cancelEdit()">Batal Edit</button>
        </form>
      </div>
    </div>

    <!-- 3. HALAMAN TRANSFER -->
    <div id="page-transfer" class="space-y-4 hidden">
      <div class="card p-5 space-y-4">
        <h2 class="font-bold text-sm text-blue-600" id="title-transfer">Transfer Antar Rekening</h2>
        <form onsubmit="handleFormSubmit(event, 'Transfer')" class="space-y-3.5">
          <div><label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Tanggal</label><input type="date" id="transferTanggal" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs"></div>
          <div><label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Dari Rekening (Asal)</label><input list="listRekening" id="transferAsal" placeholder="Pilih rekening asal..." required autocomplete="off" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs"></div>
          <div><label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Ke Rekening (Tujuan)</label><input list="listRekening" id="transferTujuan" placeholder="Pilih rekening tujuan..." required autocomplete="off" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs"></div>
          <div><label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Jumlah (Rp)</label><input type="number" id="transferJumlah" placeholder="0" min="0" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-bold"></div>
          <div><label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Catatan / Admin</label><textarea id="transferCatatan" rows="2" placeholder="Biaya admin atau keterangan..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs"></textarea></div>
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-3 rounded-xl text-xs shadow-md transition">Proses Transfer</button>
          <button type="button" class="w-full bg-slate-300 text-slate-700 font-bold p-2.5 rounded-xl text-xs cancel-edit-btn hidden" onclick="cancelEdit()">Batal Edit</button>
        </form>
      </div>
    </div>

    <!-- 4. HALAMAN TRANSAKSI (Dikelompokkan Per Hari) -->
    <div id="page-transaksi" class="space-y-4 hidden">
      <div id="listTransaksiPerHari" class="space-y-4"></div>
    </div>

    <!-- 5. HALAMAN LAPORAN / DASHBOARD STATISTIK -->
    <div id="page-laporan" class="space-y-4">
      <div class="grid grid-cols-2 gap-3">
        <div class="card p-4 bg-emerald-50 border-emerald-100"><p class="text-[10px] uppercase font-bold text-emerald-600">Total Pemasukan</p><p id="sumTotalMasuk" class="text-sm font-extrabold text-emerald-700 mt-1">Rp 0</p></div>
        <div class="card p-4 bg-red-50 border-red-100"><p class="text-[10px] uppercase font-bold text-red-600">Total Pengeluaran</p><p id="sumTotalKeluar" class="text-sm font-extrabold text-red-700 mt-1">Rp 0</p></div>
      </div>

      <div class="card p-5 space-y-3 shadow-sm">
        <h3 class="font-bold text-xs text-slate-400 uppercase tracking-wider">Statistik Keseluruhan</h3>
        <div class="h-56 relative"><canvas id="chartMasukKeluar"></canvas></div>
      </div>

      <div class="card p-5 space-y-4 shadow-sm">
        <div class="flex justify-between items-center">
          <h2 class="font-bold text-sm text-slate-800">Filter Laporan Waktu</h2>
        </div>
        <select id="selectFilterWaktu" onchange="renderLaporan()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-semibold">
          <option value="semua">Semua Waktu</option>
          <option value="hari-ini">Hari Ini</option>
          <option value="minggu-ini">Minggu Ini</option>
          <option value="bulan-ini" selected>Bulan Ini</option>
          <option value="tahun-ini">Tahun Ini</option>
          <option value="kustom">Rentang Kustom</option>
        </select>
        <div id="customDateBox" class="hidden grid grid-cols-2 gap-2">
          <div><label class="text-[10px] text-slate-400">Dari</label><input type="date" id="filterStart" onchange="renderLaporan()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs"></div>
          <div><label class="text-[10px] text-slate-400">Sampai</label><input type="date" id="filterEnd" onchange="renderLaporan()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs"></div>
        </div>
        <div class="grid grid-cols-2 gap-2 pt-2">
          <button onclick="downloadExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold p-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-sm transition"><i class="fa-solid fa-file-excel"></i> Unduh Excel</button>
          <button onclick="downloadPDF()" class="bg-slate-700 hover:bg-slate-800 text-white font-bold p-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-sm transition"><i class="fa-solid fa-print"></i> Cetak PDF</button>
        </div>
      </div>
    </div>

    <!-- 6. HALAMAN PENGATURAN (MASTER DATA CRUD) -->
    <div id="page-pengaturan" class="space-y-4 hidden">
      <div class="card p-5 space-y-4">
        <h2 class="font-bold text-sm text-slate-800">⚙️ Tambah Master Data</h2>
        <form onsubmit="handleMasterSubmit(event)" class="space-y-3">
          <div><label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Tipe Master</label><select id="masterJenis" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs"><option value="Rekening">Rekening / Akun</option><option value="KategoriMasuk">Kategori Pemasukan</option><option value="KategoriKeluar">Kategori Pengeluaran</option></select></div>
          <div><label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Nama Master Data</label><input type="text" id="masterNama" placeholder="Contoh: Dompet Digital / Bonus" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs"></div>
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-3 rounded-xl text-xs shadow-md transition">+ Tambah Master</button>
        </form>
      </div>

      <div class="card p-5 space-y-4">
        <h3 class="font-bold text-sm text-slate-800">Daftar Master Data Terdaftar</h3>
        <div id="masterListContainer" class="space-y-3 text-xs"></div>
      </div>
    </div>
  </main>

  <!-- BOTTOM NAVIGATION BAR (6 TOMBOL) -->
  <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/90 backdrop-blur-md border-t border-slate-100 px-3 py-2 flex justify-around items-center z-30 shadow-lg">
    <button onclick="switchTab('masuk')" id="nav-masuk" class="flex flex-col items-center gap-1 text-slate-400 hover:text-emerald-600 transition"><i class="fa-solid fa-circle-plus text-base"></i><span class="text-[9px]">Masuk</span></button>
    <button onclick="switchTab('keluar')" id="nav-keluar" class="flex flex-col items-center gap-1 text-slate-400 hover:text-red-600 transition"><i class="fa-solid fa-circle-minus text-base"></i><span class="text-[9px]">Keluar</span></button>
    <button onclick="switchTab('transfer')" id="nav-transfer" class="flex flex-col items-center gap-1 text-slate-400 hover:text-blue-600 transition"><i class="fa-solid fa-right-left text-base"></i><span class="text-[9px]">Transfer</span></button>
    <button onclick="switchTab('transaksi')" id="nav-transaksi" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-700 transition"><i class="fa-solid fa-receipt text-base"></i><span class="text-[9px]">Transaksi</span></button>
    <button onclick="switchTab('laporan')" id="nav-laporan" class="flex flex-col items-center gap-1 text-emerald-600 font-bold transition"><i class="fa-solid fa-chart-pie text-base"></i><span class="text-[9px]">Laporan</span></button>
    <button onclick="switchTab('pengaturan')" id="nav-pengaturan" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-700 transition"><i class="fa-solid fa-gear text-base"></i><span class="text-[9px]">Pengaturan</span></button>
  </nav>

  <!-- DATALIST GLOBAL -->
  <datalist id="listRekening"></datalist>
  <datalist id="listKategoriMasuk"></datalist>
  <datalist id="listKategoriKeluar"></datalist>

  <!-- JAVASCRIPT UTAMA -->
  <script>
    let GLOBAL_DATA = { transactions: [], rekenings: [], kategoriMasuk: [], kategoriKeluar: [], saldo: 0, totalMasuk: 0, totalKeluar: 0 };
    let myChartInstance = null;

    function formatRp(val) { return 'Rp ' + Number(val).toLocaleString('id-ID'); }

    // Set tanggal default hari ini
    const todayStr = new Date().toISOString().split('T')[0];
    ['masukTanggal', 'keluarTanggal', 'transferTanggal'].forEach(id => {
      const el = document.getElementById(id);
      if(el) el.value = todayStr;
    });

    window.onload = function() { loadAppData(); };

    function loadAppData() {
      google.script.run.withSuccessHandler(data => {
        GLOBAL_DATA = data;
        renderApp();
      }).getInitialData();
    }

    function renderApp() {
      // Header & Summary
      document.getElementById('headerTotalSaldo').innerText = formatRp(GLOBAL_DATA.saldo);
      document.getElementById('sumTotalMasuk').innerText = formatRp(GLOBAL_DATA.totalMasuk);
      document.getElementById('sumTotalKeluar').innerText = formatRp(GLOBAL_DATA.totalKeluar);

      // Datalists
      fillDatalist('listRekening', GLOBAL_DATA.rekenings.map(r => r.nama));
      fillDatalist('listKategoriMasuk', GLOBAL_DATA.kategoriMasuk.map(k => k.nama));
      fillDatalist('listKategoriKeluar', GLOBAL_DATA.kategoriKeluar.map(k => k.nama));

      renderTransaksiPerHari(GLOBAL_DATA.transactions);
      renderLaporan();
      renderMasterSettings();
    }

    function fillDatalist(id, items) {
      const list = document.getElementById(id);
      if(!list) return;
      list.innerHTML = '';
      items.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item;
        list.appendChild(opt);
      });
    }

    // Transaksi Dikelompokkan Per Hari
    function renderTransaksiPerHari(txs) {
      const container = document.getElementById('listTransaksiPerHari');
      if(!container) return;
      if (!txs || txs.length === 0) {
        container.innerHTML = '<div class="card p-6 text-center text-slate-400 text-xs">Belum ada catatan transaksi.</div>';
        return;
      }

      const groups = {};
      txs.forEach(t => {
        if (!groups[t.tanggal]) groups[t.tanggal] = [];
        groups[t.tanggal].push(t);
      });

      let html = '';
      for (const tgl in groups) {
        const d = new Date(tgl);
        const dateLabel = isNaN(d) ? tgl : d.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        
        html += `<div class="space-y-2"><div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider px-1">${dateLabel}</div>`;
        groups[tgl].forEach(item => {
          let desc = item.rekAsal;
          if (item.tipe === 'Transfer') desc = `${item.rekAsal} ➔ ${item.rekTujuan}`;
          if (item.catatan) desc += ` • ${item.catatan}`;

          let colorClass = item.tipe === 'Pemasukan' ? 'text-emerald-600' : item.tipe === 'Pengeluaran' ? 'text-red-600' : 'text-blue-600';
          let sign = item.tipe === 'Pemasukan' ? '+' : item.tipe === 'Pengeluaran' ? '-' : '';

          html += `
            <div class="card p-3.5 flex justify-between items-center shadow-sm">
              <div>
                <p class="font-bold text-xs text-slate-800">${item.kategori || item.tipe}</p>
                <p class="text-[11px] text-slate-400 mt-0.5">${desc}</p>
              </div>
              <div class="flex items-center gap-3">
                <span class="text-xs font-extrabold ${colorClass}">${sign} ${formatRp(item.jumlah)}</span>
                <div class="flex gap-1">
                  <button onclick="editTx(${item.rowIndex})" class="w-7 h-7 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center text-[10px]" title="Edit"><i class="fa-solid fa-pen"></i></button>
                  <button onclick="deleteTx(${item.rowIndex})" class="w-7 h-7 rounded-lg bg-red-50 hover:bg-red-100 text-red-600 flex items-center justify-center text-[10px]" title="Hapus"><i class="fa-solid fa-trash"></i></button>
                </div>
              </div>
            </div>
          `;
        });
        html += `</div>`;
      }
      container.innerHTML = html;
    }

    // Switch Tab Navigasi
    function switchTab(tabName) {
      ['masuk', 'keluar', 'transfer', 'transaksi', 'laporan', 'pengaturan'].forEach(t => {
        const page = document.getElementById('page-' + t);
        const nav = document.getElementById('nav-' + t);
        if(page) page.classList.add('hidden');
        if(nav) {
          nav.className = "flex flex-col items-center gap-1 text-slate-400 hover:text-slate-700 transition";
        }
      });

      const activePage = document.getElementById('page-' + tabName);
      const activeNav = document.getElementById('nav-' + tabName);
      if(activePage) activePage.classList.remove('hidden');
      if(activeNav) {
        let activeColor = tabName === 'masuk' ? 'text-emerald-600 font-bold' : tabName === 'keluar' ? 'text-red-600 font-bold' : tabName === 'transfer' ? 'text-blue-600 font-bold' : 'text-slate-800 font-bold';
        activeNav.className = `flex flex-col items-center gap-1 ${activeColor} transition`;
      }
    }

    // Submit Transaksi (Simpan / Edit)
    function handleFormSubmit(event, tipe) {
      event.preventDefault();
      const rowIndex = document.getElementById('editRowIndex').value;

      let tanggal, rekAsal, rekTujuan, kategori, jumlah, catatan;
      if(tipe === 'Pemasukan') {
        tanggal = document.getElementById('masukTanggal').value;
        rekAsal = document.getElementById('masukRek').value;
        kategori = document.getElementById('masukKat').value;
        jumlah = document.getElementById('masukJumlah').value;
        catatan = document.getElementById('masukCatatan').value;
      } else if(tipe === 'Pengeluaran') {
        tanggal = document.getElementById('keluarTanggal').value;
        rekAsal = document.getElementById('keluarRek').value;
        kategori = document.getElementById('keluarKat').value;
        jumlah = document.getElementById('keluarJumlah').value;
        catatan = document.getElementById('keluarCatatan').value;
      } else if(tipe === 'Transfer') {
        tanggal = document.getElementById('transferTanggal').value;
        rekAsal = document.getElementById('transferAsal').value;
        rekTujuan = document.getElementById('transferTujuan').value;
        kategori = 'Transfer';
        jumlah = document.getElementById('transferJumlah').value;
        catatan = document.getElementById('transferCatatan').value;
      }

      const payload = { rowIndex: rowIndex ? Number(rowIndex) : null, tanggal, tipe, rekAsal, rekTujuan, kategori, jumlah, catatan };

      google.script.run.withSuccessHandler(res => {
        alert(res.message);
        cancelEdit();
        event.target.reset();
        loadAppData();
        switchTab('transaksi');
      }).simpanTransaksi(payload);
    }

    // Edit Transaksi
    function editTx(rowIndex) {
      const tx = GLOBAL_DATA.transactions.find(t => t.rowIndex === rowIndex);
      if(!tx) return;

      document.getElementById('editRowIndex').value = rowIndex;
      if(tx.tipe === 'Pemasukan') {
        switchTab('masuk');
        document.getElementById('masukTanggal').value = tx.tanggal;
        document.getElementById('masukRek').value = tx.rekAsal;
        document.getElementById('masukKat').value = tx.kategori;
        document.getElementById('masukJumlah').value = tx.jumlah;
        document.getElementById('masukCatatan').value = tx.catatan;
        document.querySelectorAll('.cancel-edit-btn').forEach(b => b.classList.remove('hidden'));
      } else if(tx.tipe === 'Pengeluaran') {
        switchTab('keluar');
        document.getElementById('keluarTanggal').value = tx.tanggal;
        document.getElementById('keluarRek').value = tx.rekAsal;
        document.getElementById('keluarKat').value = tx.kategori;
        document.getElementById('keluarJumlah').value = tx.jumlah;
        document.getElementById('keluarCatatan').value = tx.catatan;
        document.querySelectorAll('.cancel-edit-btn').forEach(b => b.classList.remove('hidden'));
      } else if(tx.tipe === 'Transfer') {
        switchTab('transfer');
        document.getElementById('transferTanggal').value = tx.tanggal;
        document.getElementById('transferAsal').value = tx.rekAsal;
        document.getElementById('transferTujuan').value = tx.rekTujuan;
        document.getElementById('transferJumlah').value = tx.jumlah;
        document.getElementById('transferCatatan').value = tx.catatan;
        document.querySelectorAll('.cancel-edit-btn').forEach(b => b.classList.remove('hidden'));
      }
    }

    function cancelEdit() {
      document.getElementById('editRowIndex').value = '';
      document.querySelectorAll('.cancel-edit-btn').forEach(b => b.classList.add('hidden'));
    }

    function deleteTx(rowIndex) {
      if(confirm("Hapus catatan transaksi ini?")) {
        google.script.run.withSuccessHandler(res => {
          alert(res.message);
          loadAppData();
        }).hapusTransaksi(rowIndex);
      }
    }

    // Filter Laporan & Grafik Statistik
    function renderLaporan() {
      const mode = document.getElementById('selectFilterWaktu').value;
      const customBox = document.getElementById('customDateBox');
      if(customBox) customBox.classList.toggle('hidden', mode !== 'kustom');

      let filtered = GLOBAL_DATA.transactions;
      const now = new Date();

      if(mode === 'hari-ini') {
        const today = now.toISOString().split('T')[0];
        filtered = filtered.filter(t => t.tanggal === today);
      } else if(mode === 'minggu-ini') {
        const firstDay = new Date(now.setDate(now.getDate() - now.getDay()));
        filtered = filtered.filter(t => new Date(t.tanggal) >= firstDay);
      } else if(mode === 'bulan-ini') {
        const ym = now.toISOString().slice(0, 7);
        filtered = filtered.filter(t => t.tanggal.startsWith(ym));
      } else if(mode === 'tahun-ini') {
        const y = now.getFullYear().toString();
        filtered = filtered.filter(t => t.tanggal.startsWith(y));
      } else if(mode === 'kustom') {
        const start = document.getElementById('filterStart').value;
        const end = document.getElementById('filterEnd').value;
        if(start && end) filtered = filtered.filter(t => t.tanggal >= start && t.tanggal <= end);
      }

      let tMasuk = 0, tKeluar = 0;
      filtered.forEach(t => {
        if(t.tipe === 'Pemasukan') tMasuk += t.jumlah;
        if(t.tipe === 'Pengeluaran') tKeluar += t.jumlah;
      });

      renderChart(tMasuk, tKeluar);
    }

    function renderChart(masuk, keluar) {
      const ctx = document.getElementById('chartMasukKeluar');
      if(!ctx) return;
      if(myChartInstance) myChartInstance.destroy();

      myChartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Pemasukan', 'Pengeluaran'],
          datasets: [{
            data: [masuk, keluar],
            backgroundColor: ['#10b981', '#ef4444'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom', labels: { font: { size: 10 } } } }
        }
      });
    }

    // Pengaturan Master Data
    function handleMasterSubmit(event) {
      event.preventDefault();
      const jenis = document.getElementById('masterJenis').value;
      const nama = document.getElementById('masterNama').value.trim();
      if(!nama) return;

      google.script.run.withSuccessHandler(res => {
        alert(res.message);
        document.getElementById('masterNama').value = '';
        loadAppData();
      }).tambahMasterManual(jenis, nama);
    }

    function renderMasterSettings() {
      const container = document.getElementById('masterListContainer');
      if(!container) return;

      let html = '<div class="space-y-2">';
      GLOBAL_DATA.rekenings.forEach(r => {
        html += `<div class="flex justify-between items-center bg-slate-50 p-2.5 rounded-xl border border-slate-100"><span><b>Rekening:</b> ${r.nama}</span><div class="flex gap-1"><button onclick="editMaster(${r.rowIndex}, '${r.nama}')" class="px-2 py-1 bg-white border border-slate-200 rounded-lg text-[10px]">Edit</button><button onclick="deleteMaster(${r.rowIndex})" class="px-2 py-1 bg-red-50 text-red-600 rounded-lg text-[10px]">Hapus</button></div></div>`;
      });
      GLOBAL_DATA.kategoriMasuk.forEach(k => {
        html += `<div class="flex justify-between items-center bg-slate-50 p-2.5 rounded-xl border border-slate-100"><span><b>Kat. Masuk:</b> ${k.nama}</span><div class="flex gap-1"><button onclick="editMaster(${k.rowIndex}, '${k.nama}')" class="px-2 py-1 bg-white border border-slate-200 rounded-lg text-[10px]">Edit</button><button onclick="deleteMaster(${k.rowIndex})" class="px-2 py-1 bg-red-50 text-red-600 rounded-lg text-[10px]">Hapus</button></div></div>`;
      });
      GLOBAL_DATA.kategoriKeluar.forEach(k => {
        html += `<div class="flex justify-between items-center bg-slate-50 p-2.5 rounded-xl border border-slate-100"><span><b>Kat. Keluar:</b> ${k.nama}</span><div class="flex gap-1"><button onclick="editMaster(${k.rowIndex}, '${k.nama}')" class="px-2 py-1 bg-white border border-slate-200 rounded-lg text-[10px]">Edit</button><button onclick="deleteMaster(${k.rowIndex})" class="px-2 py-1 bg-red-50 text-red-600 rounded-lg text-[10px]">Hapus</button></div></div>`;
      });
      html += '</div>';
      container.innerHTML = html;
    }

    function editMaster(rowIndex, oldName) {
      const newName = prompt("Ubah nama master data:", oldName);
      if(newName && newName.trim() !== "" && newName !== oldName) {
        google.script.run.withSuccessHandler(res => {
          alert(res.message);
          loadAppData();
        }).updateMasterData(rowIndex, newName.trim());
      }
    }

    function deleteMaster(rowIndex) {
      if(confirm("Hapus master data ini?")) {
        google.script.run.withSuccessHandler(res => {
          alert(res.message);
          loadAppData();
        }).hapusMasterData(rowIndex);
      }
    }

    // Export Excel & PDF
    function downloadExcel() {
      let csv = 'Tanggal,Tipe,Rekening Asal,Rekening Tujuan,Kategori,Jumlah,Catatan\n';
      GLOBAL_DATA.transactions.forEach(t => {
        csv += `"${t.tanggal}","${t.tipe}","${t.rekAsal}","${t.rekTujuan}","${t.kategori}",${t.jumlah},"${t.catatan}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `Laporan_MoneyManager_${new Date().toISOString().split('T')[0]}.csv`;
      link.click();
    }

    function downloadPDF() {
      window.print();
    }
  </script>
</body>
